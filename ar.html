<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#bedec9">
<title>Примерка пандуса AR</title>
<meta name="description" content="GoApsny: Stopgap — модель пандуса в AR в масштабе 1:1. Параметры: ?hl=85&hr=70&width=900&board=40&paint=102C54">
<script>
// «Живая» оболочка, как в приложении: настроение берётся из того же ключа браузера (мята по умолчанию, ночь — тёмная)
(function () {
  try {
    var d = document.documentElement, mood = null;
    try { mood = localStorage.getItem("goapsny-stopgap:mood"); } catch (e) {}
    if (!/^(sage|orchid|lime|night)$/.test(mood)) mood = "sage";
    d.dataset.skin = "living"; d.dataset.mood = mood; d.dataset.theme = mood === "night" ? "dark" : "light";
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = { sage: "#bedec9", orchid: "#f7cbe7", lime: "#f5f9ad", night: "#182620" }[mood];
  } catch (e) {}
})();
</script>
<style>
/* Токены — подмножество src/skin-living.css, чтобы страница работала отдельно */
:root {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --orchid: #e88cc8; --lime: #eaf372; --ink: #161817;
  --st-a: #bedec9; --st-b: #8fc0a1; --st-c: #5d9573;
  --stage: linear-gradient(180deg, var(--st-a) 0%, var(--st-b) 52%, var(--st-c) 100%);
  --stage-ink: #18231c; --stage-glass: rgba(255, 255, 255, .42); --stage-pill-bg: rgba(28, 40, 33, .86);
  --glow-a: rgba(255, 255, 255, .55); --glow-b: rgba(234, 243, 114, .36);
  --bg: #f8f9f8; --cell: #ffffff; --label: #161817; --label-2: rgba(22, 24, 23, .58);
  --sep: rgba(22, 24, 23, .09); --fill: #f1f3f2;
  --tint: #e88cc8; --title-ink: #161817; --prominent: #161817; --on-prominent: #ffffff; --focus: #161817;
  --red-soft: rgba(251, 113, 133, .16); --orange-soft: rgba(234, 243, 114, .5);
  --card-shadow: 0 8px 26px rgba(0, 0, 0, .04); --cta-shadow: 0 12px 26px rgba(22, 24, 23, .18);
  --shadow-sheet: 0 -16px 40px rgba(0, 0, 0, .16); --grabber: rgba(0, 0, 0, .14);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-mood=orchid] {
  --st-a: #f7cbe7; --st-b: #e796ca; --st-c: #c96ba9; --stage-ink: #271522; --stage-pill-bg: rgba(42, 20, 36, .84);
}
:root[data-mood=lime] {
  --st-a: #f5f9ad; --st-b: #e1ea77; --st-c: #bccb53; --stage-ink: #1e2210; --stage-pill-bg: rgba(30, 34, 16, .88);
  --glow-b: rgba(232, 140, 200, .3);
}
:root[data-mood=night] {
  color-scheme: dark;
  --st-a: #182620; --st-b: #101b16; --st-c: #09110d; --stage-ink: #e8f1eb;
  --stage-glass: rgba(255, 255, 255, .14); --stage-pill-bg: rgba(255, 255, 255, .14);
  --glow-a: rgba(142, 192, 161, .3); --glow-b: rgba(234, 243, 114, .16);
  --bg: #0d1511; --cell: #17221c; --label: #e8f1eb; --label-2: rgba(232, 241, 235, .64);
  --sep: rgba(255, 255, 255, .09); --fill: rgba(255, 255, 255, .07);
  --title-ink: #e8f1eb; --prominent: #eaf372; --on-prominent: #161817; --focus: #eaf372;
  --red-soft: rgba(251, 113, 133, .18); --orange-soft: rgba(234, 243, 114, .14);
  --card-shadow: 0 8px 26px rgba(0, 0, 0, .28); --cta-shadow: 0 12px 26px rgba(0, 0, 0, .4);
  --shadow-sheet: 0 -16px 40px rgba(0, 0, 0, .5); --grabber: rgba(255, 255, 255, .22);
}
:root[data-mood=night] .sgar-sw button span { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 3px 8px rgba(0, 0, 0, .3); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--label); font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
body { background: var(--stage) fixed; }

/* страница под примеркой: видна, когда примерку закрыли или в адресе ошибка */
main { box-sizing: border-box; min-height: 100%; max-width: 480px; margin: 0 auto; padding: calc(var(--safe-t) + 28px) 18px calc(var(--safe-b) + 24px); display: flex; flex-direction: column; justify-content: flex-end; }
h1 { margin: 0 0 8px; font-size: 34px; line-height: 38px; font-weight: 300; letter-spacing: -.04em; color: var(--stage-ink); }
p { margin: 0 0 18px; color: var(--stage-ink); opacity: .72; font-size: 15px; line-height: 21px; letter-spacing: -.01em; }
.err { padding: 14px 18px; border-radius: 18px; background: linear-gradient(var(--red-soft), var(--red-soft)), var(--cell); color: var(--label); opacity: 1; box-shadow: var(--card-shadow); }
button.go { min-height: 58px; width: 100%; border: 0; border-radius: 999px; background: var(--prominent); color: var(--on-prominent); font: 600 16px/1 var(--font); letter-spacing: -.01em; cursor: pointer; box-shadow: var(--cta-shadow); transition: transform .35s var(--spring); }
button.go:active { transform: scale(.96); }
button.go:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }

/* окно примерки (разметка и свои стили — в src/ar.js): сцена в цвете настроения, внизу лист */
:root .sgar { background: var(--stage); font-family: var(--font); overflow: hidden; }
:root .sgar::before, :root .sgar::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; }
:root .sgar::before { left: -90px; top: 4%; width: 300px; height: 300px; background: var(--glow-a); animation: arFloat 14s ease-in-out infinite alternate; }
:root .sgar::after { right: -110px; top: 26%; width: 280px; height: 280px; background: var(--glow-b); animation: arFloat 18s ease-in-out infinite alternate-reverse; }
:root .sgar > * { position: relative; z-index: 1; }
:root .sgar-bar { padding: calc(14px + var(--safe-t)) 18px 8px; }
:root .sgar-title { font-size: 28px; line-height: 32px; font-weight: 300; letter-spacing: -.04em; color: var(--stage-ink); }
:root .sgar-x { width: 42px; height: 42px; margin: 0; border-radius: 50%; background: var(--stage-glass); color: var(--stage-ink); font: 400 24px/1 var(--font); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: transform .35s var(--spring); }
:root .sgar-x:active { transform: scale(.92); }
:root .sgar-x:focus-visible, :root .sgar-go:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
:root .sgar-stage model-viewer { background: transparent; }
:root .sgar-msg { color: var(--stage-ink); opacity: .7; font-weight: 400; }
:root .sgar-hs { padding: 5px 11px; border-radius: 999px; background: var(--stage-pill-bg); font: 600 12px/1.2 var(--font); letter-spacing: -.01em; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
:root .sgar-hs.sgar-step { background: var(--orchid); color: var(--ink); box-shadow: 0 6px 16px rgba(232, 140, 200, .4); }
:root .sgar-hs.sgar-step::before { background: var(--orchid); }
:root .sgar-sheet { z-index: 2; max-width: none; padding: 26px 18px calc(16px + var(--safe-b)); gap: 14px; background: var(--bg); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-sheet); animation: arRise .6s var(--spring) both; }
:root .sgar-sheet::before { content: ""; position: absolute; left: 50%; top: 9px; width: 38px; height: 5px; margin-left: -19px; border-radius: 999px; background: var(--grabber); }
:root .sgar-dims { gap: 8px; border-radius: 0; overflow: visible; background: none; }
:root .sgar-dims div { padding: 11px 4px 10px; border-radius: 18px; box-shadow: var(--card-shadow); }
:root .sgar-dims dt { font-size: 10.5px; line-height: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
:root .sgar-dims dd { margin-top: 3px; font-size: 24px; line-height: 28px; font-weight: 300; letter-spacing: -.04em; }
:root .sgar-dims dd small { font-size: 11px; font-weight: 500; letter-spacing: 0; }
:root .sgar-paint { gap: 6px; padding: 12px 14px 8px; border-radius: 26px; background: var(--cell); box-shadow: var(--card-shadow); }
:root .sgar-pl { padding: 0 4px; font-size: 13px; line-height: 18px; }
:root .sgar-sw { gap: 0; margin: 0 -3px; }
:root .sgar-sw button { flex-basis: 40px; width: 40px; height: 42px; transition: transform .35s var(--spring); }
:root .sgar-sw button:active { transform: scale(.9); }
:root .sgar-sw button span { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1), 0 3px 8px rgba(0, 0, 0, .1); transition: box-shadow .25s, transform .35s var(--spring); }
:root .sgar-sw button[aria-pressed="true"] span { transform: scale(.88); box-shadow: 0 0 0 3px var(--cell), 0 0 0 5.5px var(--label); }
:root .sgar-sw button:focus-visible { outline: 2.5px solid var(--focus); outline-offset: -2px; }
:root .sgar-hint { padding: 0 6px; font-size: 13px; line-height: 18px; letter-spacing: -.01em; }
:root .sgar-go { min-height: 58px; border-radius: 999px; font: 600 16px/1 var(--font); letter-spacing: -.01em; box-shadow: var(--cta-shadow); transition: transform .35s var(--spring), opacity .2s; }
:root .sgar-go:not([disabled]):active { transform: scale(.96); }
:root .sgar-go[disabled] { opacity: .38; box-shadow: none; }
:root .sgar-fb { padding: 12px 16px; border-radius: 18px; font-size: 13px; line-height: 18px; font-weight: 500; }
@keyframes arFloat { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(26px, 34px, 0) scale(1.12); } }
@keyframes arRise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 900px) {
  /* компьютер: лист — отдельная карточка по центру */
  :root .sgar-sheet { max-width: 560px; margin-bottom: 24px; padding-bottom: 20px; border-radius: 28px; box-shadow: 0 16px 40px rgba(0, 0, 0, .14); }
  :root .sgar-sheet::before { display: none; }
  :root .sgar-bar { padding-left: 28px; padding-right: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  :root .sgar::before, :root .sgar::after, :root .sgar-sheet { animation: none; }
  :root .sgar-x, :root .sgar-go, :root .sgar-sw button, :root .sgar-sw button span, button.go { transition: none; }
}
</style>
</head>
<body>
<main id="page">
  <h1>Примерка пандуса</h1>
  <p id="note">Загружаем модель…</p>
  <button type="button" class="go" id="reopen" hidden>Открыть примерку</button>
</main>
<noscript><p style="padding:24px">Для примерки нужен JavaScript.</p></noscript>
<script type="module">
import { build } from "./src/ramp.js";
import { createAR } from "./src/ar.js";
import { createPaints } from "./src/paints.js";

const q = new URLSearchParams(location.search);
const num = (k) => {
  const v = q.get(k);
  if (v == null || v.trim() === "") return undefined;
  const n = Number(v.trim().replace(",", "."));
  return Number.isFinite(n) ? n : NaN;
};
const params = {};
for (const k of ["hl", "hr", "width", "board", "freeWidth"]) { const v = num(k); if (v !== undefined) params[k] = v; }
const rawPaint = (q.get("paint") || "").trim();
const paint = !rawPaint || /^(raw|none|нет)$/i.test(rawPaint) ? null : "#" + rawPaint.replace(/^#/, "");

const note = document.getElementById("note"), reopen = document.getElementById("reopen");
const bad = Object.entries(params).filter(([, v]) => Number.isNaN(v)).map(([k]) => k);
const ar = createAR();
let model = null, problem = null;
if (bad.length) problem = `Неверное число в адресе: ${bad.join(", ")}.`;
else if (paint && !/^#[0-9a-f]{6}$/i.test(paint)) problem = `Цвет «${rawPaint}»: ожидается вид 102C54.`;
else {
  model = build(params);
  const errs = model.issues.filter((i) => i.level === "error");
  if (errs.length) problem = errs.map((i) => i.text).join(" ");
}
if (problem) {
  note.className = "err"; note.textContent = problem;
} else {
  const p = model.params;
  note.textContent = `А ${p.hl} мм, Б ${p.hr} мм, ширина ${p.width} мм`.replace(/\./g, ",");
  // на своём https-адресе GLB отдаёт /api/glb (нужен Scene Viewer на Android); локально — blob
  const qFor = (hex) => { const u = new URLSearchParams(location.search); u.set("paint", hex ? hex.replace(/^#/, "") : "raw"); return u; };
  const srcFor = location.protocol === "https:" ? (hex) => `${location.origin}/api/glb?${qFor(hex)}` : undefined;
  // цвет меняется прямо в примерке; адрес страницы запоминает его, чтобы ссылкой делиться уже в цвете
  const fromIk = q.get("from") === "ik";   // открыта из мастера замера
  const onPaint = (hex) => {
    try { history.replaceState(null, "", `${location.pathname}?${qFor(hex)}${location.hash}`); } catch {}
    cur = hex;
    if (fromIk) { try { localStorage.setItem("stopgap-ar-paint", JSON.stringify({ hex: hex || null, t: Date.now() })); } catch {} }
  };
  let cur = paint;
  const paints = createPaints().list();
  // из мастера: «×» закрывает эту вкладку и возвращает к замеру; если браузер не дал закрыть — подсказка и кнопка
  const onClose = () => {
    if (fromIk) { try { window.close(); } catch {} }
    setTimeout(() => { if (fromIk) note.textContent = "Вернитесь на вкладку с замером. Цвет уже в заявке."; reopen.hidden = false; reopen.focus(); }, 300);
  };
  const show = () => { reopen.hidden = true; ar.open(document.body, model, cur, { srcFor, paints, onPaint, onClose }); };
  reopen.addEventListener("click", show);
  show();
}
</script>
</body>
</html>
